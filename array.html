<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = [1,2,3,4,5];
        let sum =0;
        let mul =1;
        for (let i =0; i<a.length; i++)
    {
        sum +=a[i];
        mul *=a[i];
    }
    document.write("sum =",+sum +"<br>");
    document.write("product=",+mul);
    </script>
</body>
</html>
