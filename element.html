<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
let arr = [10, 20, 30, 40, 50];
let key = 30;
let found = false;
for (let i = 0; i < arr.length; i++) {
    if (arr[i] === key) {
        found = true;
        break;
    }
}
if (found) {
    document.write("Element found");
} else {
    document.write("Element not found");
}
</script>
    
</body>
</html>
